[project]
name = "prd-context"
version = "0.1.0"
description = "Shared read-only PRD context for coding agents"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2"]

[project.scripts]
prd-mcp = "prd_context.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prd_context"]
