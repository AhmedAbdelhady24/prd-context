name: PRD context checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory server --frozen
      - run: python3 scripts/sync_adapters.py --check
      - run: python3 scripts/sync_adapters.py
      - run: server/.venv/bin/python tests/check.py
